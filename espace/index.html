<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Espace privé</title>
<style>
:root{--navy:#140E59;--corail:#EF7D53;--bg:#F5F4FA;--ink:#16141F;--muted:#5E5B6E;--line:#D9D7E6;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0F0D24;--ink:#ECEAF6;--muted:#A6A3BC;--line:#2C2850;--surface:#18153A}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.mark{width:36px;height:4px;background:var(--corail);border-radius:2px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 4px;color:var(--ink)}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--corail);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:13px;color:var(--muted)}
button{width:100%;font:600 15px inherit;font-family:inherit;padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{background:var(--corail);color:#140E59}}
button:disabled{opacity:.6;cursor:default}
#etat{min-height:20px;margin:14px 0 0;font-size:13px}
#etat.err{color:#C2412D}
small{display:block;margin-top:18px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>Espace privé</h1>
  <p>Pilotage des contrats. Le contenu est chiffré : il ne s'ouvre qu'avec le mot de passe.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="espace" autocomplete="username" hidden>
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="garder" type="checkbox"><label for="garder" style="margin:0;font-weight:400">Rester connecté sur cet appareil</label></div>
    <button id="ok" type="submit">Ouvrir</button>
    <div id="etat" role="status" aria-live="polite"></div>
  </form>
  <small>Sur un appareil partagé, ne coche pas la case. Pour oublier cet appareil : ajoute ?oublier à l'adresse.</small>
</main>
<script src="espace.js?v=1"></script>
</body>
</html>
